<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sidebar-open-close-methods</title>
  <style>button{display: block; margin: 8px;}</style>
</head>

<body>
  <output id="ref-loadtime"></output>
  <fieldset>
    <legend>sidebarAction</legend>
    <button id="ref-sidebar-open">Open sidebar: sidebarAction.open();</button>
    <button id="ref-sidebar-close">Close sidebar: sidebarAction.close();</button>
    <button id="ref-sidebar-toggle">Toggle sidebar: sidebarAction.toggle();</button>
  </fieldset>
  <fieldset>
    <legend>sidePanel</legend>
    <button id="ref-sidepanel-open">Open sidepanel: sidePanel.open({ windowId: currentWindowId });</button>
    <button id="ref-sidepanel-close">Close sidepanel: sidePanel.close({ windowId: currentWindowId });</button>
    <button id="ref-sidepanel-toggle">Toggle sidepanel: sidePanel.toggle({ windowId: currentWindowId });</button>
    sidePanel.getLayout() result:
    <output id="ref-layout"></output>
  </fieldset>
  <script src="main.js"></script>
</body>

</html>
